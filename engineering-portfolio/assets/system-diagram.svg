<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="title desc">
<title id="title">Arduino motion and temperature monitoring system</title>
<desc id="desc">DHT11 and PIR connect to an Arduino Uno R3, which drives a 20 by 2 parallel LCD, LED, and active buzzer. No infrared obstacle sensor is included.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a465f" stroke-width=".55"/></pattern><linearGradient id="board" x2="1" y2="1"><stop stop-color="#2376a1"/><stop offset="1" stop-color="#154f78"/></linearGradient></defs>
<rect width="660" height="460" fill="#12243a"/><rect width="660" height="460" fill="url(#grid)" opacity=".8"/>
<text x="29" y="35" fill="#84b9d4" font-size="12" font-family="sans-serif" letter-spacing="2">SYSTEM ARCHITECTURE / REV 01</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="210" y="138" width="242" height="177" rx="14" fill="url(#board)" stroke="#58acd0" stroke-width="2"/><rect x="232" y="160" width="198" height="133" rx="8" fill="none" stroke="#7cc5e1" stroke-dasharray="5 7"/><text x="331" y="206" fill="#e7f9ff" font-size="22" font-weight="bold">ELEGOO</text><text x="331" y="233" fill="#e7f9ff" font-size="22" font-weight="bold">UNO R3</text><text x="331" y="263" fill="#a6ddea" font-size="12">MICROCONTROLLER</text></g>
<g fill="#1b3d55" stroke="#66becd" stroke-width="1.5"><rect x="28" y="95" width="142" height="87" rx="9"/><rect x="28" y="252" width="142" height="87" rx="9"/><rect x="497" y="69" width="134" height="87" rx="9"/><rect x="497" y="190" width="134" height="87" rx="9"/><rect x="497" y="314" width="134" height="87" rx="9"/></g>
<g fill="#e3f6ff" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle"><text x="99" y="130">DHT11</text><text x="99" y="287">PIR SENSOR</text><text x="564" y="104">20×2 LCD</text><text x="564" y="225">LED</text><text x="564" y="348">BUZZER</text></g>
<g fill="#93c6dc" font-family="sans-serif" font-size="11" text-anchor="middle"><text x="99" y="151">TEMPERATURE</text><text x="99" y="309">MOTION</text><text x="564" y="125">DISPLAY</text><text x="564" y="247">VISUAL ALERT</text><text x="564" y="371">AUDIO ALERT</text></g>
<g fill="none" stroke-width="3" stroke-linecap="round"><path d="M170 139H188V184H210" stroke="#61d4c9"/><path d="M170 297H190V269H210" stroke="#61d4c9"/><path d="M452 183H476V110H497" stroke="#e6b36c"/><path d="M452 225H497" stroke="#e6b36c"/><path d="M452 275H476V354H497" stroke="#e6b36c"/></g>
